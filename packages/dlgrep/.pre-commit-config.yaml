fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: "Ruff linter"
        entry: uv run --no-sync ruff check --exit-non-zero-on-fix --fix --config=pyproject.toml
        language: system
        files: '^(dlgrep|tests).*\.(py|ipynb)$'
        pass_filenames: false
      - id: ruff-format
        name: "Ruff formatter"
        entry: uv run --no-sync ruff format --config=pyproject.toml
        language: system
        files: '^(dlgrep|tests).*\.(py|ipynb)$'
        pass_filenames: false
  - repo: local
    hooks:
      - id: mypy
        name: MyPy
        entry: uv run --no-sync mypy dlgrep
        pass_filenames: false
        language: system
        files: '\.py$'
      - id: pytest
        name: Pytest
        entry: uv run --no-sync pytest tests
        pass_filenames: false
        language: system
        files: '\.py$'
  - repo: local
    hooks:
      - id: uv-lock
        name: "uv lockfile"
        entry: uv lock
        pass_filenames: false
        language: system
