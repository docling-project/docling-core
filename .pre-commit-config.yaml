fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        name: "Ruff linter"
        args: [--exit-non-zero-on-fix, --fix, --config=pyproject.toml]
        files: '^(docling_core|tests|docs/examples|examples|packages/dclq).*\.(py|ipynb)$'
        pass_filenames: false
      - id: ruff-format
        name: "Ruff formatter"
        args: [--config=pyproject.toml]
        files: '^(docling_core|tests|docs/examples|examples|packages/dclq).*\.(py|ipynb)$'
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-compat-projectors
        name: Compat projector coverage
        entry: uv run --no-sync python scripts/check_compat_projectors.py
        pass_filenames: false
        language: system
        files: '(docling_core/compat\.py|docling_core/types/doc/common/constants\.py|docling_core/types/doc/.*\.py|docs/DoclingDocument\.json)$'
  - repo: local
    hooks:
      - id: mypy
        name: MyPy
        entry: uv run --no-sync mypy docling_core tests packages/dclq/dclq packages/dclq/tests
        pass_filenames: false
        language: system
        files: '\.py$'
  - repo: local
    hooks:
      - id: pytest
        name: Pytest
        entry: uv run --no-sync pytest --cov=docling_core --cov-report=xml tests
        pass_filenames: false
        language: system
        files: '\.py$'
      - id: pytest-dclq
        name: Pytest (dclq)
        entry: uv run --no-sync pytest packages/dclq/tests
        pass_filenames: false
        language: system
        files: '\.py$'
  - repo: local
    hooks:
      - id: docs
        name: Docs
        entry: uv run --no-sync python -m docling_core.utils.generate_docs docs
        pass_filenames: false
        language: system
        files: '\.py$'
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      - id: uv-lock
        name: "uv lockfile"
        entry: uv lock
        pass_filenames: false
        language: system
